<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>모델링 아케이드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: 제도용 모눈종이 위에 ERD 엔티티 박스처럼 생긴 스테이지 노드. 두 레인(RDB / DW)이 7일 동안 나란히 내려간다. */
:root{
  --paper:#EDF1F6; --grid:#D9E1EC; --card:#FFFFFF; --ink:#16233B; --muted:#5A6B85; --line:#C3CEDD;
  --rdb:#0E7C86; --rdb-soft:#D5EEF0; --dw:#B86E00; --dw-soft:#FBEBD0;
  --accent:#2F55D4; --ok:#1F8A4C; --ok-soft:#DDF2E5; --bad:#C8363D; --bad-soft:#F9DEDF; --gold:#E0A100;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1623; --grid:#18233A; --card:#16203A; --ink:#E4EAF5; --muted:#93A3BD; --line:#2B3A57;
  --rdb:#3CC2CC; --rdb-soft:#12343B; --dw:#F2A93B; --dw-soft:#3A2A10;
  --accent:#7C9BFF; --ok:#4CC783; --ok-soft:#123323; --bad:#FF6B72; --bad-soft:#3D1A1D; --gold:#F5C542; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1623; --grid:#18233A; --card:#16203A; --ink:#E4EAF5; --muted:#93A3BD; --line:#2B3A57;
  --rdb:#3CC2CC; --rdb-soft:#12343B; --dw:#F2A93B; --dw-soft:#3A2A10;
  --accent:#7C9BFF; --ok:#4CC783; --ok-soft:#123323; --bad:#FF6B72; --bad-soft:#3D1A1D; --gold:#F5C542; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
a{color:var(--accent)}
code,.mono{font-family:var(--f-mono)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:30px;line-height:1}
.brand small{color:var(--muted);font-size:12px;letter-spacing:.08em}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:4px 10px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-family:var(--f-mono);font-weight:600}
.lvl{min-width:0;flex:1 1 240px}
.bar{height:8px;background:var(--grid);border-radius:4px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .5s}

/* quest card */
.quest{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;box-shadow:4px 4px 0 var(--ink);margin-bottom:26px}
.quest .eyebrow{font-size:12px;letter-spacing:.1em;color:var(--muted)}
.quest h2{font-size:22px;margin:2px 0 6px}
.quest .goals{display:flex;gap:8px;flex-wrap:wrap;font-size:13px}
.goal{padding:2px 8px;border-radius:4px;border:1.5px dashed var(--line)}
.goal.done{border-style:solid;background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.quest .actions{display:flex;flex-direction:column;gap:8px}
@media (max-width:560px){.quest{grid-template-columns:1fr}.quest .actions{flex-direction:row;flex-wrap:wrap}}

.btn{border:2px solid var(--ink);background:var(--card);border-radius:6px;padding:8px 14px;font-weight:700;font-size:14px;box-shadow:3px 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--ink)}
.btn.rdb{background:var(--rdb);color:#fff}
.btn.dw{background:var(--dw);color:#fff}
.btn.ghost{box-shadow:none;border-color:var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
:root[data-theme="dark"] .btn.primary, :root[data-theme="dark"] .btn.rdb, :root[data-theme="dark"] .btn.dw{color:#0F1623}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary,:root:not([data-theme="light"]) .btn.rdb,:root:not([data-theme="light"]) .btn.dw{color:#0F1623}}

/* map */
.lanehead{display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;margin-bottom:8px;font-family:var(--f-display);font-size:18px}
.lanehead span:first-child{color:var(--rdb)} .lanehead span:last-child{color:var(--dw);text-align:right}
.map{display:flex;flex-direction:column;gap:14px;position:relative}
.row{display:grid;grid-template-columns:1fr 56px 1fr;gap:10px;align-items:stretch}
.daypin{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:11px;color:var(--muted);position:relative}
.daypin b{font-family:var(--f-display);font-size:24px;line-height:1;color:var(--ink)}
.row.today .daypin b{color:var(--accent)}
.row.today .daypin::after{content:"TODAY";font-size:9px;letter-spacing:.1em;color:#fff;background:var(--accent);padding:1px 5px;border-radius:3px;margin-top:3px}
.entity{text-align:left;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:0;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .1s}
.entity:hover{transform:translateY(-2px)}
.entity .eh{padding:5px 10px;font-family:var(--f-mono);font-size:12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;color:#fff}
.entity.rdb .eh{background:var(--rdb)} .entity.dw .eh{background:var(--dw)}
:root[data-theme="dark"] .entity .eh{color:#0F1623}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .entity .eh{color:#0F1623}}
.entity .eb{padding:8px 10px 10px;display:flex;flex-direction:column;gap:4px}
.entity .t{font-weight:700;font-size:15px;line-height:1.35}
.entity .c{font-size:12px;color:var(--muted);line-height:1.4}
.stars{display:inline-flex;gap:1px;letter-spacing:0}
.star{width:13px;height:13px;display:inline-block}
.entity.cleared{box-shadow:4px 4px 0 var(--ok)}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}
@media (max-width:520px){.row,.lanehead{grid-template-columns:1fr 34px 1fr;gap:6px}.entity .c{display:none}.entity .t{font-size:13.5px}.daypin b{font-size:19px}}

/* play */
.playtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.keys{display:flex;gap:4px;align-items:center}
.key{width:26px;height:26px}
.key.lost{opacity:.18}
.prog{display:flex;gap:4px;flex:1 1 160px;max-width:320px}
.prog i{flex:1;height:8px;border-radius:2px;background:var(--grid);border:1px solid var(--line)}
.prog i.ok{background:var(--ok);border-color:var(--ok)} .prog i.no{background:var(--bad);border-color:var(--bad)} .prog i.cur{background:var(--accent);border-color:var(--accent)}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:20px;box-shadow:5px 5px 0 var(--ink)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;font-weight:600;padding:2px 7px;border-radius:3px;letter-spacing:.04em}
.tag.rdb{background:var(--rdb-soft);color:var(--rdb)} .tag.dw{background:var(--dw-soft);color:var(--dw)}
.tag.kind{background:var(--grid);color:var(--muted)}
.qhead{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.q{font-size:18px;font-weight:700;line-height:1.5;margin:0 0 14px;text-wrap:pretty}
.q code{font-size:.88em;background:var(--grid);padding:1px 5px;border-radius:3px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--line);background:var(--card);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:start;font-size:14.5px;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .k{font-family:var(--f-mono);font-size:12px;font-weight:600;border:1.5px solid var(--line);border-radius:4px;text-align:center;line-height:20px;height:22px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.opt code{font-size:.9em}
.sortrow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:10px 0;border-bottom:1px dashed var(--line)}
.sortrow:last-child{border-bottom:0}
.sortrow .lab{font-weight:500}
.sortrow .lab small{display:block;color:var(--muted);font-size:12px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:4px;padding:3px 9px;font-size:13px;font-family:var(--f-mono)}
.seg button.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.seg button.should{outline:2px solid var(--ok);outline-offset:1px}
.sortrow.right .lab::before{content:"✓ ";color:var(--ok);font-weight:700}
.sortrow.wrong .lab::before{content:"✗ ";color:var(--bad);font-weight:700}
.numin{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.numin input{font-family:var(--f-mono);font-size:20px;padding:8px 12px;border:2px solid var(--ink);border-radius:6px;background:var(--card);color:var(--ink);width:min(260px,100%)}
.numin .unit{color:var(--muted)}
.code{font-family:var(--f-mono);font-size:13px;border:2px solid var(--line);border-radius:6px;overflow-x:auto;background:var(--paper)}
.code button{display:grid;grid-template-columns:30px max-content;gap:8px;width:100%;min-width:max-content;text-align:left;border:0;background:transparent;padding:3px 10px 3px 0;white-space:pre;font-family:inherit;font-size:inherit;border-left:4px solid transparent}
.code button .n{color:var(--muted);text-align:right;user-select:none}
.code button:hover:not(:disabled){background:var(--grid)}
.code button.sel{background:var(--bad-soft);border-left-color:var(--bad)}
.code button.miss{background:var(--ok-soft);border-left-color:var(--ok)}
.code button.hit{background:var(--bad-soft);border-left-color:var(--ok)}
.code button:disabled{cursor:default}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
.submitbar{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
/* 문제 시각화 */
.vis{display:grid;gap:10px;margin:0 0 14px;min-width:0}
.vis>div{min-width:0}
#card{min-width:0}
.vcap{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--muted);margin:0 0 4px;text-transform:none}
.vtb{overflow-x:auto;border:2px solid var(--line);border-radius:6px}
.vtb table{border-collapse:collapse;width:100%;font-size:13px;font-family:var(--f-mono)}
.vtb th{background:var(--grid);color:var(--ink);text-align:left;font-weight:600;padding:5px 9px;white-space:nowrap;border-bottom:2px solid var(--line)}
.vtb td{padding:5px 9px;border-top:1px solid var(--line);white-space:nowrap}
.vtb td.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}
.vtb td.hl{background:color-mix(in srgb,var(--accent) 12%,var(--card));color:var(--accent);font-weight:600}
.vtb td.ok{background:var(--ok-soft);color:var(--ok)}
.vtb td.mute{color:var(--muted);text-decoration:line-through}
.verd{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.vent{border:2px solid var(--ink);border-radius:5px;background:var(--card);min-width:118px;font-family:var(--f-mono);font-size:12px;overflow:hidden}
.vent b{display:block;background:var(--ink);color:var(--card);padding:3px 8px;font-size:12px}
.vent span{display:flex;justify-content:space-between;gap:8px;padding:2px 8px;border-top:1px dashed var(--line)}
.vent span:first-of-type{border-top:0}
.vent span.slot{color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card));font-weight:600}
.vent i{font-style:normal;font-size:10px;font-weight:600;border-radius:3px;padding:0 4px;align-self:center}
.vent i.pk{background:var(--gold);color:#16233B} .vent i.fk{background:var(--grid);color:var(--muted);border:1px solid var(--line)}
.vpair{display:flex;align-items:center;gap:6px}
.vlink{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:2px;white-space:nowrap}
.vlink::before,.vlink::after{content:"";width:10px;height:2px;background:var(--line)}
.vtl{list-style:none;margin:0;padding:0 0 0 4px;border-left:3px solid var(--line)}
.vtl li{position:relative;padding:3px 0 3px 14px;font-size:14px}
.vtl li::before{content:"";position:absolute;left:-8px;top:10px;width:11px;height:11px;border-radius:50%;background:var(--card);border:2.5px solid var(--accent)}
.vtl li b{font-family:var(--f-mono);font-size:12px;display:inline-block;min-width:74px;color:var(--accent)}
.vtl li.hl{font-weight:700}
.vfl{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.vfl span{border:2px solid var(--ink);border-radius:999px;padding:2px 11px;font-size:13px;font-weight:600;background:var(--card)}
.vfl span.bad{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.vfl em{font-style:normal;color:var(--muted);font-weight:700}
.vfacts{display:grid;gap:5px;margin:0;padding:0;list-style:none}
.vfacts li{border:1.5px solid var(--line);border-radius:6px;padding:6px 10px;font-size:14px;background:var(--card);display:flex;gap:8px}
.vfacts li::before{content:"▸";color:var(--accent);font-weight:700}
.vfacts code{font-size:.9em;background:var(--grid);padding:1px 5px;border-radius:3px}
.vvs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vvs>div{border:2px solid var(--line);border-radius:6px;overflow:hidden}
.vvs h4{margin:0;padding:5px 10px;background:var(--grid);font-size:13px}
.vvs ul{margin:0;padding:6px 10px 8px 26px;font-size:13.5px;line-height:1.55}
@media (max-width:520px){.vvs{grid-template-columns:1fr}}
.scnbox{margin:0 0 12px;font-size:13.5px;color:var(--muted)}
.scnbox summary{cursor:pointer;font-family:var(--f-mono);font-size:12px;font-weight:600}
.scnbox p{margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--line);color:var(--ink)}
.q{font-weight:500} .q b{font-weight:800;color:var(--accent)}
/* 단계별 힌트 */
.hints{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.hintbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hbtn{display:inline-flex;gap:8px;align-items:center;border:2px solid var(--accent);color:var(--accent);background:var(--card);border-radius:999px;padding:5px 14px 5px 10px;font-weight:700;font-size:14px}
.hbtn:hover:not(:disabled){background:color-mix(in srgb,var(--accent) 10%,var(--card))}
.hbtn:disabled{opacity:.45;cursor:default}
.hbtn kbd{font-family:var(--f-mono);font-size:11px;border:1.5px solid currentColor;border-radius:3px;padding:0 4px;font-weight:600}
.hdots{display:flex;gap:4px}
.hdots i{width:22px;height:6px;border-radius:3px;background:var(--grid);border:1px solid var(--line)}
.hdots i.on{background:var(--accent);border-color:var(--accent)}
.hcost{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.hcard{margin-top:10px;border-left:4px solid var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card));border-radius:0 6px 6px 0;padding:9px 12px;font-size:14.5px;line-height:1.55}
.hcard.new{animation:hin .25s ease-out}
.hcard .hl{display:block;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.hcard.last{border-left-color:var(--gold)} .hcard.last .hl{color:var(--gold)}
.hcard code{font-size:.9em;background:var(--grid);padding:1px 5px;border-radius:3px}
@keyframes hin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.fb{margin-top:16px;border-radius:6px;padding:12px 14px;border:2px solid;font-size:14.5px}
.fb.ok{border-color:var(--ok);background:var(--ok-soft)} .fb.no{border-color:var(--bad);background:var(--bad-soft)}
.fb .head{font-family:var(--f-display);font-size:18px;margin-bottom:4px}
.fb.ok .head{color:var(--ok)} .fb.no .head{color:var(--bad)}
.fb p{margin:0}
.pop{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-family:var(--f-display);font-size:34px;color:var(--accent);pointer-events:none;animation:pop .9s ease-out forwards;z-index:20;text-shadow:2px 2px 0 var(--card)}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.05)}100%{opacity:0;transform:translate(-50%,-40px) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){.pop,.shake,.hcard{animation:none}.pop{display:none}.entity:hover,.btn:hover{transform:none}}

/* briefing & boss */
.brief h2{font-size:28px;margin:6px 0 8px}
.brief .scn{margin:0 0 12px;max-width:65ch}
.brief ul{margin:0 0 14px;padding-left:20px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.boss{border-color:var(--bad);box-shadow:5px 5px 0 var(--bad)}
.boss .eyebrow{font-family:var(--f-mono);font-size:12px;color:var(--bad);letter-spacing:.1em;font-weight:600}
.timer{font-family:var(--f-mono);font-size:32px;font-weight:600;font-variant-numeric:tabular-nums}
.check{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);align-items:start;cursor:pointer}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok)}
.tasks{margin:0 0 12px;padding-left:20px}
.result{text-align:center}
.result h2{font-size:40px;margin:4px 0}
.bigstars{display:flex;justify-content:center;gap:8px;margin:10px 0}
.bigstars .star{width:44px;height:44px}
.kv{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px 0}
.kv div{border:1.5px solid var(--line);border-radius:6px;padding:8px 14px;min-width:110px}
.kv b{display:block;font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.kv span{font-size:12px;color:var(--muted)}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.small{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
</style>

<div class="wrap" id="app"></div>

<script>
const REPO = "https://github.com/suojae/DAE_study_with_claude/blob/main/drills/";

/* ───────────── 스테이지 데이터 (drills/ 문제에서 추림) ───────────── */
const STAGES = [
/* ===== RDB ===== */
{id:"rdb01",track:"rdb",day:1,file:"rdb/01-library-loan.md",title:"도서관 대출",tags:"1:N · M:N · Gerund",diff:1,
 scn:"동네 도서관 대출 시스템. 같은 책을 여러 권 소장하고, 각 권에는 등록번호(바코드)가 붙는다. 회원은 최대 5권, 같은 권을 동시에 두 명이 빌릴 수는 없다.",
 tasks:["엔티티 · 관계 · 카디널리티 ERD","PostgreSQL DDL","'데이터 모델링 입문' 중 지금 빌릴 수 있는 권 쿼리"],
 qs:[
  {t:"mcq",q:"샘플에 '데이터 모델링 입문'이 B-0001, B-0002 두 줄로 나온다. 엔티티를 어떻게 나눌까?",
   o:["<code>book</code> 하나에 <code>copy_count</code> 컬럼","<code>book</code>(ISBN) + <code>book_copy</code>(등록번호) 분리","<code>book_copy</code> 하나에 제목·출판사까지 전부","<code>loan</code>에 ISBN과 제목을 저장"],a:1,
   w:"작품으로서의 책(ISBN)과 서가에 꽂힌 한 권(등록번호)은 다른 것. 한 테이블이면 제목·출판사가 권 수만큼 중복된다."},
  {t:"sort",q:"각 속성은 어느 테이블에 붙을까?",b:["member","book","book_copy","loan","book_author"],
   i:[["실제 반납일",3],["서가 위치",2],["출판사",1],["저자 순서(제1저자…)",4],["연락처",0],["반납 예정일",3]],
   w:"대출일·반납일은 '이 회원이 이 권을' 빌린 사건의 속성 → loan(Gerund). 저자 순서는 책–저자 M:N 연결의 속성."},
  {t:"mcq",q:"'같은 시점에 같은 권을 두 명이 빌릴 수 없다'를 DB가 지키게 하려면?",
   o:["<code>UNIQUE (copy_id, member_id)</code>","<code>UNIQUE (copy_id)</code>","<code>CREATE UNIQUE INDEX … ON loan(copy_id) WHERE returned_at IS NULL</code>","<code>CHECK (count(*) &lt;= 1)</code>"],a:2,
   w:"진짜 규칙은 '미반납 대출이 권마다 하나'. (copy_id, member_id) UNIQUE는 같은 사람이 나중에 또 빌리는 것까지 막고, (copy_id) UNIQUE는 이력을 못 남긴다."},
  {t:"bug",q:"이 DDL에서 잘못된 줄을 모두 골라라.",
   l:["CREATE TABLE book (","  isbn       TEXT PRIMARY KEY,","  title      TEXT NOT NULL,","  authors    TEXT,          -- '홍길동, 김철수'","  is_loaned  BOOLEAN",");","CREATE TABLE loan (","  loan_id     BIGSERIAL PRIMARY KEY,","  member_id   BIGINT NOT NULL REFERENCES member,","  copy_id     TEXT   NOT NULL REFERENCES book_copy,","  returned_at DATE,","  UNIQUE (copy_id, member_id)",");"],bad:[3,4,11],
   w:"authors를 문자열로 → 1정규형 위반, 저자별 검색 불가. is_loaned → 권이 여러 개면 의미 없고 이력도 없음. UNIQUE(copy_id, member_id) → 재대출을 막아버림."},
  {t:"mcq",q:"'회원은 한 번에 최대 5권'은 어떻게 지킬까?",
   o:["CHECK 제약","UNIQUE 제약","앱 로직 + 트랜잭션 (또는 트리거)","FK 제약"],a:2,
   w:"행 하나만 봐서는 판단할 수 없는 규칙이라 CHECK로 못 건다. 모든 규칙을 DB 제약으로 걸 수 있는 건 아니다."}
 ],
 pts:["책(book)과 한 권(book_copy)을 분리했다","저자는 book_author 연결 테이블로 M:N을 풀었다","loan을 별도 테이블(대출일·반납 예정일·반납일)로 뒀다","미반납 대출에 partial UNIQUE 인덱스를 걸었다"]},

{id:"rdb02",track:"rdb",day:2,file:"rdb/02-academy-sections.md",title:"학원 분반",tags:"Weak entity · 부분 키 · 복합 FK",diff:2,
 scn:"과목마다 분반이 여러 개. 분반 번호는 과목 안에서만, 학기마다 다시 1부터 매긴다. 학생은 여러 분반을 신청하고, 같은 분반을 두 번 신청할 수 없다.",
 tasks:["분반이 Strong인지 Weak인지 판단","분반 식별자 결정","수강신청을 (A) 복합 FK / (B) 대리키 두 방식으로 설계 후 선택"],
 qs:[
  {t:"mcq",q:"분반(section)은 어떤 엔티티인가?",
   o:["Strong — 분반 번호만으로 식별된다","Weak — 분반 번호는 부분 키라 과목·학기를 빌려야 식별된다","연관(Associative) 엔티티","과목의 서브타입"],a:1,
   w:"'1반'만으로는 반을 찾을 수 없다. 아파트 '1001호'처럼 동(과목+학기)이 있어야 의미가 생긴다."},
  {t:"mcq",q:"분반의 식별자는?",
   o:["<code>(section_no)</code>","<code>(course_code, section_no)</code>","<code>(term, course_code, section_no)</code>","<code>(section_no, instructor_id)</code>"],a:2,
   w:"학기를 빼면 2026-1의 MATH1 1반과 2026-2의 MATH1 1반이 충돌한다."},
  {t:"num",q:"(A) 방식(분반 키를 그대로 복합 FK로)으로 하면 수강신청 테이블의 PK는 컬럼이 몇 개?",a:4,u:"개",
   w:"term + course_code + section_no + student_id = 4개. 자식(출석, 과제)으로 내려갈수록 더 길어진다."},
  {t:"mcq",q:"분반 아래로 출석·과제·성적 테이블이 계속 생길 예정이다. 어떻게 할까?",
   o:["(A) 복합 키를 계속 내려받는다","(B) <code>section_id</code> 대리키 + <code>UNIQUE (term, course_code, section_no)</code>","(B) <code>section_id</code> 대리키만 두고 UNIQUE는 생략","section_no를 전체에서 유일한 번호(1~157)로 바꾼다"],a:1,
   w:"자식이 많으면 대리키가 편하다. 단 Weak라는 사실은 그대로라 진짜 식별 규칙(UNIQUE)은 반드시 남긴다. 전역 번호로 바꾸면 'MATH1 2반'이라는 현실의 이름을 잃는다."},
  {t:"mcq",q:"수강생이 있는 분반을 지우려 할 때 수강신청 FK의 ON DELETE 정책은?",
   o:["CASCADE — 같이 지운다","RESTRICT — 삭제를 막는다","SET NULL","FK를 걸지 않는다"],a:1,
   w:"학사 이력은 날아가면 안 된다. CASCADE보다 RESTRICT, 혹은 삭제 대신 closed_at 같은 상태 컬럼."}
 ],
 pts:["section을 Weak entity로 보고 (term, course_code, section_no)를 식별자로 잡았다","(A)/(B) 두 방식을 비교했다","대리키를 쓰더라도 UNIQUE(term, course_code, section_no)를 남겼다","ON DELETE RESTRICT, grade NULL 허용을 정했다"]},

{id:"rdb03",track:"rdb",day:3,file:"rdb/03-org-chart.md",title:"사내 조직도",tags:"재귀 관계 · 다중 관계",diff:2,
 scn:"직원은 직속 상사 1명, 부서는 상위 부서 최대 1개인 트리. 직원은 한 부서에 소속되고, 부서마다 부서장(직원)이 있다. 멘토링은 M:N이며 시작일·종료일이 있다.",
 tasks:["재귀 관계를 모두 찾기","직원 ↔ 부서 관계를 모두 찾기","DDL","김본부 산하 전체 직원 SQL (재귀 CTE)"],
 qs:[
  {t:"num",q:"이 시나리오에서 재귀(자기 자신을 가리키는) 관계는 몇 개?",a:3,u:"개",
   w:"직원→상사, 부서→상위 부서, 직원↔직원 멘토링."},
  {t:"sort",q:"각 관계를 테이블로 옮기면?",b:["컬럼 하나 (FK)","연결 테이블"],
   i:[["직원 → 직속 상사",0],["부서 → 상위 부서",0],["멘토 ↔ 멘티 (시작·종료일)",1],["직원 → 소속 부서",0],["부서 → 부서장",0]],
   w:"1:N(재귀 포함)은 컬럼 하나, M:N은 연결 테이블. 멘토링은 M:N + 속성이라 테이블."},
  {t:"mcq",q:"멘토링 테이블의 두 FK 컬럼 이름으로 가장 좋은 것은?",
   o:["<code>employee_id_1</code>, <code>employee_id_2</code>","<code>mentor_id</code>, <code>mentee_id</code>","<code>a_id</code>, <code>b_id</code>","<code>parent_id</code>, <code>child_id</code>"],a:1,
   w:"재귀 관계는 양쪽이 같은 엔티티라 역할 이름이 없으면 방향을 알 수 없다."},
  {t:"mcq",q:"'소속'과 '부서장'을 <code>employee.is_head BOOLEAN</code> 하나로 합치면?",
   o:["깔끔해서 권장된다","겸임·대행을 표현 못 하고, 한 부서에 부서장이 둘 생기는 것도 못 막는다","INSERT 순서 문제가 사라져서 더 낫다","정규화 위반이지만 동작은 같다"],a:1,
   w:"소속(N:1)과 부서장(1:1)은 의미가 다른 별개 관계 — 다중 관계."},
  {t:"mcq",q:"<code>CHECK (manager_id &lt;&gt; employee_id)</code>를 걸었다. A의 상사가 B, B의 상사가 A인 순환은?",
   o:["막힌다","못 막는다 — CHECK는 같은 행만 본다","FK가 막아준다","UNIQUE(manager_id)를 추가하면 막힌다"],a:1,
   w:"순환은 여러 행에 걸친 규칙. 앱 로직이나 재귀 CTE로 주기 검사."}
 ],
 pts:["manager_id, parent_id 재귀 FK 컬럼을 뒀다","mentoring을 역할 이름(mentor_id/mentee_id) 연결 테이블로 뒀다","소속(department_id)과 부서장(head_employee_id)을 따로 뒀다","부서↔부서장 순환 참조를 NULL 허용 + ALTER(또는 DEFERRABLE)로 풀었다","WITH RECURSIVE로 산하 직원을 조회했다"]},

{id:"rdb04",track:"rdb",day:4,file:"rdb/04-group-chat.md",title:"단체 채팅방",tags:"속성 있는 M:N · 복합 FK로 규칙 강제",diff:2,
 scn:"사용자 ↔ 채팅방 M:N. 방마다 역할·참여 시각·알림 설정이 다르고, 나갔다 다시 들어올 수 있다. 방 멤버만 메시지를 보내고, 답장이 가능하며, 안 읽은 메시지 수를 보여준다.",
 tasks:["ERD (멤버십이 왜 테이블인지)","'방 멤버만 메시지' DB 제약","재입장 처리 방식","읽음 저장 방식"],
 qs:[
  {t:"sort",q:"각 속성은 어디에 붙을까?",b:["app_user","room","room_member"],
   i:[["역할 (방장·부방장·일반)",2],["닉네임",0],["방 제목",1],["알림 on/off",2],["어디까지 읽었나",2],["참여 시각",2]],
   w:"'이 사람이 이 방에서'의 속성은 사용자에도 방에도 못 붙인다 → room_member(Gerund)."},
  {t:"mcq",q:"'방 멤버만 메시지를 보낼 수 있다'를 앱 코드 없이 강제하려면?",
   o:["<code>message.sender_id → app_user(user_id)</code>","<code>FOREIGN KEY (room_id, sender_id) REFERENCES room_member(room_id, user_id)</code>","<code>CHECK (sender_id IN room)</code>","방에 <code>member_ids BIGINT[]</code>를 두고 비교"],a:1,
   w:"복합 FK는 규칙을 심는 도구. 멤버가 아닌 (방, 사람) 조합은 INSERT 자체가 실패한다."},
  {t:"num",q:"1,000명 방에 메시지 1만 개. '메시지 × 사용자'마다 읽음 행을 만들면 몇 행?",a:10000000,u:"행",
   w:"1,000만 행. last_read_message_id 하나면 1,000행으로 끝난다 (메시지 ID가 시간 순 증가라는 성질 이용)."},
  {t:"mcq",q:"민수가 방에서 나가면 room_member 행은?",
   o:["DELETE 한다","행은 두고 <code>left_at</code>을 채운다","room에서 배열 원소를 뺀다","민수의 메시지까지 지운다"],a:1,
   w:"나간 멤버의 과거 메시지가 복합 FK로 이 행을 참조하고 있다. 지우면 FK가 깨진다."},
  {t:"bug",q:"잘못된 줄을 모두 골라라.",
   l:["CREATE TABLE room (","  room_id    BIGSERIAL PRIMARY KEY,","  title      TEXT,","  member_ids BIGINT[]",");","CREATE TABLE message (","  message_id  BIGSERIAL PRIMARY KEY,","  room_id     BIGINT NOT NULL,","  sender_id   BIGINT NOT NULL REFERENCES app_user(user_id),","  reply_to_id BIGINT REFERENCES message(message_id),","  body        TEXT NOT NULL",");"],bad:[3,8],
   w:"member_ids 배열 → 멤버별 역할·알림을 둘 곳이 없다. sender_id가 app_user만 참조 → 방에 없는 사람의 메시지가 들어온다. reply_to_id 자기 참조는 정상(재귀 1:N)."}
 ],
 pts:["room_member를 PK(room_id, user_id) 연결 테이블로 뒀다","message가 (room_id, sender_id)로 room_member를 복합 FK 참조한다","reply_to_id 재귀 FK를 뒀다","last_read_message_id로 읽음 위치를 저장했다","재입장 방식((a) 행 재사용 / (b) 새 행)을 정하고 이유를 적었다"]},

{id:"rdb05",track:"rdb",day:5,file:"rdb/05-clinic-booking.md",title:"병원 예약",tags:"3항 관계 · 겹침 방지",diff:3,
 scn:"예약 = 환자가 특정 시간에 특정 의사에게 특정 진료실에서 진료받는 것. 기본 30분, 초진 60분. 의사·진료실·환자 모두 시간이 겹치면 안 되고, 취소 건은 남기되 겹침 검사에서 빠진다.",
 tasks:["2항 두 개로 쪼개면 무엇이 사라지는지 보이기","예약 테이블","겹침 방지 DB 제약 (길이가 다름에 주의)","진단 기록"],
 qs:[
  {t:"mcq",q:"예약을 (의사–진료실), (의사–환자) 2항 관계 두 개로 쪼개면?",
   o:["아무 정보도 잃지 않는다","김환자를 어느 진료실에서 몇 시에 봤는지 다시 조합할 수 없다","FK가 늘어날 뿐이다","의사 정보가 중복될 뿐이다"],a:1,
   w:"세 엔티티가 한 사건에 동시에 참여하면 3항 관계로 둔다."},
  {t:"mcq",q:"이의사의 09:00~10:00 예약이 있다. <code>UNIQUE (doctor_id, start_at)</code>는 09:30 시작 예약을 막을까?",
   o:["막는다","못 막는다 — 시작 시각이 달라서 통과한다"],a:1,
   w:"UNIQUE는 값이 똑같을 때만 막는다. 길이가 섞인 구간의 겹침은 다른 도구가 필요."},
  {t:"mcq",q:"겹침 방지로 맞는 것은?",
   o:["앱에서 SELECT로 확인 후 INSERT","<code>EXCLUDE USING gist (doctor_id WITH =, period WITH &amp;&amp;) WHERE (status &lt;&gt; 'cancelled')</code>","<code>UNIQUE (doctor_id, period)</code>","<code>CHECK (NOT overlaps(period))</code>"],a:1,
   w:"tstzrange + EXCLUDE 제약. 앱에서 SELECT 후 INSERT는 동시 요청 두 건이 둘 다 통과한다(경쟁 상태). 의사·진료실·환자 각각 하나씩 3개."},
  {t:"mcq",q:"<code>[)</code> 구간에서 10:00에 끝나는 예약과 10:00에 시작하는 예약은?",
   o:["겹친다","겹치지 않는다"],a:1,w:"반열린 구간이라 끝점이 포함되지 않는다."},
  {t:"mcq",q:"진단(상병코드 여러 개)은 어디에 붙일까?",
   o:["patient에 diagnoses 컬럼","예약 ↔ 진단 연결 테이블 (appointment_diagnosis)","<code>appointment.diagnoses TEXT = 'J00,J02'</code>","doctor에 붙인다"],a:1,
   w:"진단은 진료 1회(예약)에 붙는다. 환자에 붙이면 언제 진료의 진단인지 잃는다."}
 ],
 pts:["appointment를 환자·의사·진료실 3항 관계 테이블로 뒀다","period TSTZRANGE + EXCLUDE 제약 3개(의사/진료실/환자)를 걸었다","취소는 status로 두고 EXCLUDE에 WHERE 조건을 붙였다","진단을 appointment_diagnosis 연결 테이블로 뒀다"]},

{id:"rdb06",track:"rdb",day:6,file:"rdb/06-payment-methods.md",title:"결제 수단",tags:"슈퍼타입 / 서브타입",diff:2,

 ["수강신청 = 분반 × 학생. PK는 양쪽 식별자를 합친 것이다.","분반의 식별자는 앞 문제에서 컬럼 몇 개였지?","분반 키 3개(term, course_code, section_no) + student_id."],
 ["복합 키를 자식, 손자 테이블까지 계속 물려주면 FK와 JOIN 조건이 어떻게 될까?","대리키를 쓰면 편해진다. 그럼 '같은 학기·과목에 1반이 둘'인 데이터는 무엇이 막아주지?","대리키는 편의일 뿐이다. 비즈니스 식별 규칙은 UNIQUE로 남긴다."],
 ["분반이 지워지면 수강신청 기록(= 성적 이력)은 어떻게 돼야 할까?","CASCADE면 이력이 같이 사라지고, SET NULL이면 '어느 반 수강신청인지'가 사라진다.","지키고 싶은 건 학사 이력이다. 참조 중인 부모를 못 지우게 막는 정책을 고르자."]
],
rdb03:[
 ["재귀 관계 = 관계 양쪽 끝이 같은 엔티티. 시나리오의 관계를 하나씩 적어보자.","직원–직원, 부서–부서 사이의 관계를 모두 찾자. M:N도 재귀일 수 있다.","직원→상사, 부서→상위 부서, 그리고 시작·종료일이 있는 직원↔직원 관계 하나 더."],
 ["각 관계의 카디널리티부터: 1:N인가 M:N인가?","1:N은 N쪽에 FK 컬럼 하나면 된다. 재귀여도 똑같다.","M:N이면서 시작·종료일 같은 자체 속성까지 있는 관계는 하나뿐이다."],
 ["<code>employee_id_1</code>, <code>employee_id_2</code>만 보고 누가 멘토인지 알 수 있을까?","양쪽이 같은 테이블을 가리키면 컬럼 이름이 유일한 방향 정보다.","parent/child는 트리(상하) 구조의 말이라 멘토링과 의미가 다르다. 관계 속 '역할 이름'을 그대로 쓰자."],
 ["'소속'과 '부서장'은 카디널리티가 같을까?","부서장이 다른 부서를 대행하면 is_head 하나로 어떻게 표현하지? 같은 부서에 is_head = true가 둘 들어가면 누가 막지?","두 관계는 의미가 다른 별개 관계(다중 관계)라 컬럼도 따로 있어야 한다."],
 ["CHECK는 몇 개의 행을 보고 판단할까?","A→B, B→A 순환을 알아내려면 행 두 개를 같이 봐야 한다.","CHECK는 같은 행 안의 값만 비교한다. 자기 자신을 상사로 두는 것만 막는다."]
],
rdb04:[
 ["속성마다 물어보자: 사람 하나로 정해지나, 방 하나로 정해지나, 둘이 만나야 정해지나?","같은 사람이 A방에선 방장, B방에선 일반 멤버일 수 있다.","사람·방 조합마다 달라지는 값은 연결 테이블(room_member)로. 닉네임과 방 제목만 한쪽에 붙는다."],
 ["<code>sender_id</code>가 app_user만 참조하면 '방 멤버인가'는 누가 검사할까?","검사하고 싶은 건 (방, 보낸 사람) 쌍이 room_member에 있느냐다.","FK는 컬럼 여러 개를 묶어서 걸 수 있다. 쌍 그대로 room_member를 참조하자."],
 ["메시지 하나마다 읽음 행이 사용자 수만큼 생긴다.","10,000 × 1,000.","10,000,000. (대안: 멤버마다 <code>last_read_message_id</code> 하나만 두기)"],
 ["민수가 예전에 보낸 메시지는 어떤 FK로 room_member를 가리키고 있었지?","그 행을 지우면 FK가 어떻게 될까? 재입장 이력은 어디에 남지?","지우지 말고 '나갔다'는 상태를 기록하자."],
 ["앞 문제에서 '방 멤버만 메시지' 규칙을 어떻게 걸었는지 떠올려보자.","방 테이블에 멤버를 배열로 두면 역할·알림 설정은 어디에 넣지?","2줄이다. 배열 컬럼, 그리고 멤버십을 거치지 않는 sender FK. reply_to 자기 참조는 정상이다."]
],
rdb05:[
 ["예약 한 건에 동시에 참여하는 엔티티가 몇 개인가?","(의사, 진료실)과 (의사, 환자)를 따로 저장하면 둘을 다시 붙일 연결고리가 있을까?","3항 관계를 2항 둘로 쪼개면 '누가·어디서·언제'의 조합 정보를 잃는다."],
 ["UNIQUE는 언제 위반으로 판단할까?","09:00과 09:30은 같은 값인가?","UNIQUE는 값이 완전히 같을 때만 막는다. 구간이 겹치는지는 모른다."],
 ["'SELECT로 확인 → INSERT'를 두 요청이 동시에 하면 어떻게 될까?","PostgreSQL에는 '이 연산자로 비교해서 겹치는 행이 있으면 안 된다'는 제약이 있다. 구간은 tstzrange, 겹침 연산자는 <code>&amp;&amp;</code>.","EXCLUDE 제약 + WHERE로 취소 건을 뺀다."],
 ["<code>[</code>는 포함, <code>)</code>는 미포함이다.","<code>[09:00, 10:00)</code>은 10:00을 포함할까?","앞 예약이 10:00을 포함하지 않으니 10:00 시작 예약과 공유하는 순간이 없다."],
 ["진단은 환자의 평생 속성일까, 특정 진료의 결과일까?","진단이 여러 개인데 한 칸에 'J00,J02'로 넣으면 몇 정규형 위반이지?","진료 1회(예약)와 진단 코드의 M:N → 연결 테이블."]
],
rdb06:[
 ["payment 테이블은 결제 수단을 FK로 가리켜야 한다. 가리킬 테이블이 하나여야 할까, 셋이어도 될까?","FK 하나는 테이블 하나만 참조할 수 있다.","카드·계좌·간편결제가 따로 놀면 '아무 결제 수단'을 가리키는 FK가 불가능하다."],
 ["<code>UNIQUE (member_id, is_default)</code>는 is_default = false인 행도 검사할까?","검사 대상을 '기본이면서 삭제 안 된 수단'으로만 좁히고 싶다.","partial UNIQUE index: member_id에 걸고 <code>WHERE is_default AND deleted_at IS NULL</code>."],
 ["카드번호 원문이 DB에 있으면 어떤 규제 대상이 될까?","암호화해도 '원문 보관'이다. 실제 결제는 누가 처리하지?","PG가 결제용 토큰을 준다. 화면 표시용으론 끝 4자리면 충분하다."],
 ["FK는 부모에 '어떤 값 조합'이 존재하는지 검사할 수 있다.","자식이 부모의 (id, method_type)을 참조하고, 자식 method_type은 항상 'card'로 고정돼 있다면?","부모에 UNIQUE(id, method_type), 자식에 CHECK(method_type = 'card') + 복합 FK."],
 ["과거 결제가 참조 중인 행을 실제로 DELETE 하면 남는 선택지가 뭐지?","CASCADE면 결제까지 사라지고, SET NULL이면 '무엇으로 결제했는지'가 사라진다.","행은 남기고 '삭제됨' 표시만 한다."]
],
rdb07:[
 ["order_item이 가격을 직접 저장하지 않으면 화면의 가격은 어디서 올까?","JOIN은 항상 '지금' 값을 가져온다.","menu.price를 JOIN해서 보여주니 현재 가격이 보인다."],
 ["주문 이후 원본이 바뀌어도 '그때 값'이 유지돼야 하는 컬럼은?","주문에서만 생기는 값(수량, 요청사항)은 원본이 따로 없다.","이름·가격·주소는 복사, menu_id는 분석용 FK, 수량·요청사항은 주문 고유 값."],
 ["각 테이블이 무엇과 무엇의 관계인지 보자.","주문–메뉴 사이의 사건, 시간 따라 쌓이는 기록, 리뷰당 0~1개, 한 속성에 여러 값.","review_photo는 리뷰 하나에 사진 여러 장 = 다중값 속성을 테이블로 뺀 것이다."],
 ["1:1을 FK로 표현하려면 FK 쪽에 무엇을 더하면 될까?","customer_order에 <code>review_id NOT NULL</code>을 두면 리뷰 없는 주문은 어떻게 되지?","FK 컬럼에 UNIQUE를 걸면 같은 주문에 리뷰 두 개가 불가능해진다."],
 ["'정확히 1개'를 확인하려면 행을 몇 개 봐야 할까?","CHECK·UNIQUE·FK는 행을 세지 못한다. RDB-01의 '최대 5권'과 같은 유형이다.","검증은 앱이 하고, 규칙 자체는 min/max 컬럼으로 데이터에 남긴다."]
],
dw01:[
 ["질문 목록을 보자. 카테고리별, 행사 상품별. 답하려면 팩트 한 행에 상품이 붙어 있어야 할까?","grain은 가장 잘게 잡는 게 원칙이다. 합치는 건 나중에 언제든 되지만 쪼개는 건 불가능하다.","POS가 찍는 가장 작은 단위는 영수증의 '한 줄'이다."],
 ["팩트 = 더하거나 계산할 숫자, 차원 = 'by ~'로 자르는 기준.","점포·계산원·행사는 그룹핑 기준(차원). 수량·금액·할인은 숫자(팩트).","영수증번호는 기준이긴 한데 붙일 속성이 없다. 팩트에 번호만 남기는 degenerate 차원이다."],
 ["점포 두 곳의 값을 더했을 때 의미가 있는지 하나씩 시험해보자.","단가 1,000원 + 1,500원 = 2,500원? 이익률 30% + 20% = 50%?","금액·수량류는 가산, 단가·비율은 비가산."],
 ["1년 = 365일. 하루는 몇 분?","24 × 60 = 1,440분.","365 × 1,440."],
 ["팩트 FK가 NULL인 행을 dim_promotion과 INNER JOIN하면?","행이 사라지면 매출 합계는 어떻게 되지?","'행사 없음'도 차원의 한 행으로 만들어 두고 그 키를 넣는다."],
 ["객단가의 분모는 '영수증 수'다. 이 팩트의 한 행은 영수증일까?","COUNT(*)는 라인 수다. 영수증 수를 세려면 영수증을 구분하는 값이 필요하다.","앞에서 팩트에 남긴 degenerate 차원 receipt_no를 중복 없이 세자."],
 ["모든 컬럼의 grain이 '영수증 한 줄'과 같은지 확인하자.","영수증 한 장이 3줄이면 영수증 총액은 몇 번 저장될까? 그걸 SUM하면?","2줄이다. grain이 다른 영수증 총액, 그리고 비가산인 비율 컬럼."]
],
dw02:[
 ["요일은 함수로 나온다. '설 연휴'나 '회계분기'도 함수로 나올까?","리포트 A는 토·일, 리포트 B는 금~일을 주말로 쓰면 무슨 일이 생길까?","함수로 못 만드는 회사 달력 + 모두가 같은 정의를 쓰게 하는 것(conformed)."],
 ["FY2026은 2026년 3월에 시작해서 언제 끝날까?","3~5월 FQ1, 6~8월 FQ2, 9~11월 FQ3, 12~2월 FQ4.","2027년 2월은 FY2026의 마지막 달이다."],
 ["질문의 키워드를 컬럼명에서 찾아보자.","주말 → is_…, 설 → …_name, 회계 분기 → fiscal_…, 월급날 → days_…, 주차 → …_week.","단어 그대로 매칭된다. 고민할수록 손해다."],
 ["날짜 차원을 세 벌 만들면 공휴일 하나를 고칠 때 몇 군데를 고쳐야 할까?","물리 테이블은 하나, 이름(역할)만 여러 개라면?","같은 차원이 여러 역할로 쓰이는 패턴 = role-playing dimension."],
 ["DW-01의 '행사 없음' 문제와 같은 상황이다.","NULL FK면 JOIN에서 행이 사라진다. 그럼 '미배송 N건'을 셀 수 있을까?","'미정'을 뜻하는 특수 날짜 행(먼 미래의 날짜 키)을 만든다."]
],
dw03:[
 ["측정값(숫자)이 없으면 팩트가 아닐까?","'학생이 그 수업에 왔다'는 사건 자체가 기록이다. 몇 명 왔는지는 어떻게 세지?","측정값 없이 사건만 기록하는 팩트를 뭐라고 불렀는지 떠올리자."],
 ["결석한 학생은 입실 기록 테이블에 행이 있을까?","없는 행은 COUNT할 수 없다. 비교 대상인 '원래 와야 했던 명단'이 필요하다.","'출석했어야 하는 목록'을 별도 팩트(coverage)로 만든다."],
 ["'와야 했던 사람' = 그 회차 분반을 그날 수강 중인 학생.","수강 취소한 학생은 취소일 이후 회차에 들어가야 할까?","수업 회차 × 그 날짜에 유효한 수강신청."],
 ["기준(LEFT JOIN의 왼쪽)은 '있어야 했던 것'일까, '실제 있었던 것'일까?","roster를 왼쪽에 두고 attendance를 붙이면, 짝 없는 행은 어느 쪽 컬럼이 NULL이 될까?","roster LEFT JOIN attendance, attendance 쪽이 NULL인 행 = 결석."],
 ["학생 A는 2회 중 2회, 학생 B는 20회 중 10회 출석. 평균의 평균은?","(100% + 50%) ÷ 2 = 75%. 실제로는 12 ÷ 22 ≈ 55%.","비율은 분자 합 ÷ 분모 합으로 계산한다."]
],
dw04:[
 ["잔고 100만 원이 이틀 연속이면 내 돈은 200만 원일까?","재고는 '흐름'일까, '어느 시점의 상태'일까?","상태(잔액)는 날짜 방향으로 더하면 안 된다."],
 ["같은 날 이천 100개 + 용인 50개 = 150개. 의미 있나?","11/1 380개 + 11/2 305개는? 출고량은 이틀 치를 더하면?","잔액(on_hand)은 날짜 방향만 금지, 흐름(shipped)은 어느 방향이든 OK."],
 ["'어느 순간의 상태'인지, '기간 동안 일어난 일'인지 구분하자.","잔고·잔액은 상태다. MAU는 한 달 동안의 사람 수라 월끼리 더하면 같은 사람이 중복된다.","흐름(가산)은 주문 금액과 출고 수량뿐이다."],
 ["입출고가 없던 날의 재고는 0일까, 전날과 같을까?","행이 빠지면 '날짜 수'로 나누는 평균 재고는 어떻게 될까?","주기적 스냅샷은 변화가 없어도 매 주기마다 행을 만든다."],
 ["행 = 창고 × 상품 × 날짜.","3 × 10,000 = 하루 30,000행.","30,000 × 365."],
 ["<code>AVG(on_hand_qty)</code>는 무엇의 평균일까? 행 하나 = 창고 하나의 하루.","원하는 건 '전 창고 합계'의 날짜 평균이다. 먼저 창고 방향으로 합쳐야 한다.","전부 SUM한 다음 날짜 수로 나눈다."]
],
dw05:[
 ["트랜잭션 = 사건 하나당 한 행, 주기적 스냅샷 = 정해진 주기마다의 상태, 누적 스냅샷 = 프로세스 하나가 한 행.","잔고·재고처럼 '매일/매월의 상태'는? 단계가 정해진 흐름은?","시작과 끝이 있는 단계 흐름(주문, 대출 심사)은 누적 스냅샷."],
 ["두 시각의 차이를 초로 바꾸자.","18:10 → 18:30 = 20분.","20 × 60."],
 ["AVG는 0과 NULL을 어떻게 다르게 처리할까?","0을 넣으면 '0초 만에 끝난' 주문으로 평균에 섞인다.","아직 일어나지 않은 일은 '값 없음'이다."],

const KEY = "modeling-arcade-v1";
const LEVELS = [[0,"인턴 모델러"],[200,"주니어 모델러"],[500,"모델러"],[900,"시니어 모델러"],[1400,"데이터 아키텍트"],[2100,"킴벌의 제자"]];
let S = load();
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && typeof s==="object") return Object.assign({xp:0,best:{},wrong:[],log:{}},s);}catch(e){} return {xp:0,best:{},wrong:[],log:{}}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const today = () => { const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
function level(xp){ let i=0; for(let k=0;k<LEVELS.length;k++) if(xp>=LEVELS[k][0]) i=k; const cur=LEVELS[i], nx=LEVELS[i+1]; return {n:i+1,name:cur[1],pct: nx? (xp-cur[0])/(nx[0]-cur[0])*100 : 100, next: nx? nx[0]-xp : 0}; }
function streak(){
  const done = d => S.log[d] && S.log[d].rdb && S.log[d].dw;
  let n=0; const d=new Date(); const fmt=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!done(fmt(d))) d.setDate(d.getDate()-1);
  while(done(fmt(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const starSvg = on => `<svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z" fill="${on?"var(--gold)":"none"}" stroke="${on?"var(--gold)":"var(--line)"}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
const stars = (n,max=3) => `<span class="stars" aria-label="${n}/3 별">${Array.from({length:max},(_,i)=>starSvg(i<n)).join("")}</span>`;
const keySvg = lost => `<svg class="key ${lost?"lost":""}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="10" cy="16" r="6.5" fill="none" stroke="var(--gold)" stroke-width="3"/><path d="M16.5 16H29M24 16v5M28 16v4" stroke="var(--gold)" stroke-width="3" stroke-linecap="round"/></svg>`;
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
function popText(t){ const p=document.createElement("div"); p.className="pop"; p.textContent=t; document.body.appendChild(p); setTimeout(()=>p.remove(),950); }
const KIND = {mcq:"객관식",sort:"분류",num:"계산",bug:"버그 찾기"};
/* 문제 시각화 렌더러 */
function cell(v){ v=String(v); const m={"!":"bad","*":"hl","+":"ok","~":"mute"}[v[0]]; return m ? `<td class="${m}">${esc(v.slice(1))}</td>` : `<td>${esc(v)}</td>`; }
function col(c){ c=String(c); if(c==="?") return `<span class="slot">? <i class="fk">빈 칸</i></span>`;
  const m=c.match(/^(.*?)\s+(PK·FK|PK|FK)(.*)$/); const slot=/\?/.test(c);
  if(m) return `<span class="${slot?"slot":""}">${esc(m[1])}${esc(m[3])} <i class="${m[2]==="FK"?"fk":"pk"}">${m[2]}</i></span>`;
  return `<span class="${slot?"slot":""}">${esc(c)}</span>`; }
function vis1(v){
  const cap = v.cap ? `<div class="vcap">${esc(v.cap)}</div>` : "";
  if(v.t==="tb") return `<div>${cap}<div class="vtb"><table><thead><tr>${v.h.map(x=>`<th>${esc(x)}</th>`).join("")}</tr></thead><tbody>${v.r.map(r=>`<tr>${r.map(cell).join("")}</tr>`).join("")}</tbody></table></div></div>`;
  if(v.t==="erd") return `<div>${cap}<div class="verd">${v.e.map((e,i)=>{ const box=`<div class="vent"><b>${esc(e.n)}</b>${e.c.map(col).join("")}</div>`; const lk=i>0&&v.l&&v.l[i-1]; return i===0?box:`<span class="vpair">${lk?`<span class="vlink">${esc(lk)}</span>`:""}${box}</span>`; }).join("")}</div></div>`;
  if(v.t==="tl") return `<div>${cap}<ul class="vtl">${v.ev.map(([a,b])=>{ const hl=String(b)[0]==="*"; return `<li class="${hl?"hl":""}"><b>${esc(a)}</b> ${esc(hl?b.slice(1):b)}</li>`; }).join("")}</ul></div>`;
  if(v.t==="fl") return `<div>${cap}<div class="vfl">${v.s.map(x=>{ const bad=x[0]==="!"; return `<span class="${bad?"bad":""}">${esc(bad?x.slice(1):x)}</span>`; }).join("<em>→</em>")}</div></div>`;
  if(v.t==="facts") return `<div>${cap}<ul class="vfacts">${v.i.map(x=>`<li><span>${x}</span></li>`).join("")}</ul></div>`;
  if(v.t==="vs") return `<div>${cap}<div class="vvs">${[v.a,v.b].map(s=>`<div><h4>${esc(s.h)}</h4><ul>${s.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`).join("")}</div></div>`;
  return "";
}
const visual = q => !q.v ? "" : `<div class="vis">${[].concat(q.v).map(vis1).join("")}</div>`;
/* 힌트: 열 때마다 이 문제에서 받을 XP 비율이 줄어든다. 3단계를 다 열면 콤보도 끊긴다. */
const HINT_STEP = ["관점","좁히기","결정타"];
const HINT_MULT = [1, 0.7, 0.4, 0.2];
function renderHints(q, locked=false){
  const n = run.hintN, max = q.h.length, el = document.getElementById("hints");
  if(!el || !max) return;
  const nextPct = Math.round(HINT_MULT[Math.min(n+1,3)]*100);
  const label = n>=max ? "힌트를 모두 열었다" : `힌트 ${n+1} 열기`;
  const cost = locked ? "" : n>=max ? `이 문제 XP ${Math.round(HINT_MULT[n]*100)}% · 콤보 유지 안 됨` : `열면 이 문제 XP ${nextPct}%${n+1===max?" · 콤보 끊김":""}`;
  el.innerHTML = `<div class="hintbar">
      <button class="hbtn" id="hbtn" ${n>=max||locked?"disabled":""} aria-label="${label}">💡 ${label} <kbd>H</kbd></button>
      <span class="hdots" aria-hidden="true">${q.h.map((_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>
      <span class="hcost">${cost}</span>
    </div>
    ${q.h.slice(0,n).map((t,i)=>`<div class="hcard ${i===max-1?"last":""} ${i===n-1&&!locked?"new":""}" ${i===n-1&&!locked?'role="status"':""}><span class="hl">HINT ${i+1} · ${HINT_STEP[i]||""}</span>${t}</div>`).join("")}`;
  const b = document.getElementById("hbtn");
  if(b && !b.disabled) b.onclick = () => { run.hintN++; run.hintsUsed++; renderHints(q); };
}

/* ───────────── 플레이 ───────────── */
let run = null;
function startStage(id){
  const s = byId(id);
  run = {mode:"stage", stage:s, list:s.qs.map((q,i)=>({s,q,i})), qi:0, hearts:3, combo:0, xp:0, res:[], hintsUsed:0};
  ask();
}
function startReview(){
  const list = S.wrong.map(k=>{ const [id,i]=k.split(":"); const s=byId(id); return s && s.qs[+i] ? {s,q:s.qs[+i],i:+i} : null; }).filter(Boolean);
  if(!list.length) return home();
  run = {mode:"review", list:shuffle(list), qi:0, hearts:Infinity, combo:0, xp:0, res:[], hintsUsed:0};
  ask();
}
function topbar(){
  const n = run.list.length;
  const prog = run.list.map((_,i)=>`<i class="${i<run.qi? (run.res[i]?"ok":"no") : i===run.qi?"cur":""}"></i>`).join("");
  const hearts = run.mode==="stage" ? `<div class="keys" aria-label="남은 목숨 ${run.hearts}">${[0,1,2].map(i=>keySvg(i>=run.hearts)).join("")}</div>` : `<span class="tag kind">오답 복습 · 목숨 없음</span>`;
  return `<div class="playtop"><button class="btn ghost" id="quit">← 맵</button><div class="prog" aria-label="${run.qi+1}/${n}">${prog}</div>${hearts}<span class="chip">콤보 <b>${run.combo}</b></span><span class="chip">+<b>${run.xp}</b> XP</span></div>`;
}
function ask(){
  const {s,q} = run.list[run.qi];
  let body = "";
  if(q.t==="mcq"){
    run.order = shuffle(q.o.map((_,i)=>i));
    body = `<div class="opts">${run.order.map((oi,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span><span>${q.o[oi]}</span></button>`).join("")}</div>`;
  } else if(q.t==="sort"){
    run.items = shuffle(q.i.map((it,idx)=>({label:it[0],ans:it[1],idx})));
    run.pick = {};
    body = `<div>${run.items.map((it,r)=>`<div class="sortrow" data-r="${r}"><div class="lab">${esc(it.label)}</div><div class="seg">${q.b.map((b,bi)=>`<button data-r="${r}" data-b="${bi}">${esc(b)}</button>`).join("")}</div></div>`).join("")}</div>
      <div class="submitbar"><button class="btn primary" id="submit" disabled>제출</button><span class="hint" id="left">${run.items.length}개 남음</span></div>`;
  } else if(q.t==="num"){
    body = `<div class="numin"><input id="num" inputmode="numeric" autocomplete="off" aria-label="정답 숫자" placeholder="숫자"><span class="unit">${esc(q.u||"")}</span><button class="btn primary" id="submit">제출</button></div><div class="hint">쉼표는 넣어도 되고 안 넣어도 된다.</div>`;
  } else if(q.t==="bug"){
    run.sel = new Set();
    body = `<div class="code">${q.l.map((ln,i)=>`<button data-l="${i}"><span class="n">${i+1}</span><span>${esc(ln)}</span></button>`).join("")}</div>
      <div class="hint">잘못된 줄을 눌러 표시. 정답 줄을 정확히 다 골라야 통과. (${q.bad.length}줄)</div>
      <div class="submitbar"><button class="btn primary" id="submit">제출</button></div>`;
  }
  $app.innerHTML = topbar() + `<section class="panel" id="card">
    <div class="qhead"><span class="tag ${s.track}">${s.track.toUpperCase()}-0${s.day} ${esc(s.title)}</span><span class="tag kind">${KIND[q.t]}</span><span class="tag kind">${run.qi+1} / ${run.list.length}</span></div>
    <details class="scnbox"><summary>📋 시나리오 다시 보기</summary><p>${esc(s.scn)}</p></details>
    ${visual(q)}<p class="q">${q.q}</p>${body}<div class="hints" id="hints"></div><div id="fbslot"></div></section>`;
  document.getElementById("quit").onclick = home;
  run.hintN = 0;
  wire(q);
  renderHints(q);
}
function wire(q){
  if(q.t==="mcq"){
    $app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>judgeMcq(+b.dataset.k));
  } else if(q.t==="sort"){
    $app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
      const r=+b.dataset.r; run.pick[r]=+b.dataset.b;
      b.parentElement.querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
      const left = run.items.length - Object.keys(run.pick).length;
      document.getElementById("left").textContent = left? `${left}개 남음` : "준비 완료";
      document.getElementById("submit").disabled = left>0;
    });
    document.getElementById("submit").onclick = judgeSort;
  } else if(q.t==="num"){
    const inp = document.getElementById("num"); inp.focus();
    inp.onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); judgeNum(); } };
    document.getElementById("submit").onclick = judgeNum;
  } else if(q.t==="bug"){
    $app.querySelectorAll(".code button").forEach(b=>b.onclick=()=>{ const i=+b.dataset.l; run.sel.has(i)?run.sel.delete(i):run.sel.add(i); b.classList.toggle("sel"); });
    document.getElementById("submit").onclick = judgeBug;
  }
}
function lockAll(){ $app.querySelectorAll("#card button:not(#next)").forEach(b=>b.disabled=true); const i=document.getElementById("num"); if(i) i.disabled=true; }
function judgeMcq(k){
  const q = run.list[run.qi].q; const ok = run.order[k]===q.a;
  $app.querySelectorAll(".opt").forEach((b,j)=>{ if(run.order[j]===q.a) b.classList.add("right"); else if(j===k) b.classList.add("wrong"); });
  finish(ok);
}
function judgeSort(){
  const q = run.list[run.qi].q; let ok=true;
  run.items.forEach((it,r)=>{ const row=$app.querySelector(`.sortrow[data-r="${r}"]`); const good = run.pick[r]===it.ans; ok = ok && good;
    row.classList.add(good?"right":"wrong"); if(!good) row.querySelector(`button[data-b="${it.ans}"]`).classList.add("should"); });
  finish(ok);
}
function judgeNum(){
  const q = run.list[run.qi].q; const v = document.getElementById("num").value.replace(/[,\s_]/g,"");
  if(v==="") return; finish(Number(v)===q.a, `정답: ${q.a.toLocaleString("ko-KR")}${q.u||""}`);
}
function judgeBug(){
  const q = run.list[run.qi].q; const bad = new Set(q.bad);
  const ok = run.sel.size===bad.size && [...run.sel].every(i=>bad.has(i));
  $app.querySelectorAll(".code button").forEach(b=>{ const i=+b.dataset.l; b.classList.remove("sel");
    if(bad.has(i) && run.sel.has(i)) b.classList.add("hit"); else if(bad.has(i)) b.classList.add("miss"); else if(run.sel.has(i)) b.classList.add("sel"); });
  finish(ok, ok?"":"초록 = 잘못된 줄 (놓친 줄은 초록 배경, 잘못 고른 줄은 빨강)");
}
function finish(ok, extra=""){
  lockAll();
  const {s,q,i} = run.list[run.qi]; const key = s.id+":"+i;
  run.res[run.qi]=ok;
  let gain = 0;
  const hn = run.hintN||0, full = q.h.length && hn>=q.h.length;
  if(ok){ gain = Math.round((10 + 5*run.combo) * HINT_MULT[Math.min(hn,3)]); run.combo = full ? 0 : run.combo+1; run.xp += gain;
    popText(`+${gain} XP${hn?` · 힌트 ${hn}`:""}${run.combo>1?` · ${run.combo}콤보`:""}`);
    if(run.mode==="review") S.wrong = S.wrong.filter(k=>k!==key);
  } else { run.combo=0; if(run.mode==="stage") run.hearts--; if(!S.wrong.includes(key)) S.wrong.push(key);
    const c=document.getElementById("card"); c.classList.remove("shake"); void c.offsetWidth; c.classList.add("shake"); }
  save();
  renderHints(q, true);
  const dead = run.mode==="stage" && run.hearts<=0;
  const last = run.qi === run.list.length-1;
  const nextLabel = dead ? "결과 보기" : last ? (run.mode==="stage" ? "보스전으로" : "복습 끝") : "다음";
  document.getElementById("fbslot").innerHTML = `<div class="fb ${ok?"ok":"no"}" role="status">
    <div class="head">${ok?"정답"+(hn?` <span class="small">(힌트 ${hn}개 · XP ${Math.round(HINT_MULT[Math.min(hn,3)]*100)}%)</span>`:""):"오답"+(run.mode==="stage"?" · 열쇠 -1":"")}</div>
    ${extra && !ok?`<p class="mono" style="margin-bottom:6px">${esc(extra)}</p>`:""}<p>${q.w}</p></div>
    <div class="submitbar"><button class="btn primary" id="next">${nextLabel} (Enter)</button></div>`;
  // 상단 바 갱신
  const top = $app.querySelector(".playtop"); top.outerHTML = topbar(); document.getElementById("quit").onclick = home;
  const nx = document.getElementById("next"); nx.focus();
  nx.onclick = () => { if(dead) return gameOver(); if(last) return run.mode==="stage" ? boss() : reviewDone(); run.qi++; ask(); };
}

/* ───────────── 보스전 ───────────── */
let timerId=null, timerEnd=0;
function stopTimer(){ if(timerId){ clearInterval(timerId); timerId=null; } }
function boss(){
  const s = run.stage;
  $app.innerHTML = topbar() + `<section class="panel boss">
    <div class="eyebrow">BOSS · 직접 설계</div>
    <h2 style="font-size:26px;margin:4px 0 10px">${esc(s.title)}: 종이나 dbdiagram에 그려라</h2>
    <ol class="tasks">${s.tasks.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
    <div class="submitbar" style="margin-top:4px">
      <a class="btn ghost" href="${REPO+s.file}" target="_blank" rel="noopener">원문 문제 · 체크 질문</a>
      <a class="btn ghost" href="https://dbdiagram.io/d" target="_blank" rel="noopener">dbdiagram.io</a>
    </div>
    <div class="submitbar" style="justify-content:space-between">
      <div><div class="timer" id="tm">20:00</div><div class="small">타이머는 선택. 시간 안에 끝내면 +20 XP</div></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="tstart">타이머 시작</button><button class="btn primary" id="reveal">다 그렸다 → 채점</button></div>
    </div>
    <div id="checks"></div>
  </section>`;
  document.getElementById("quit").onclick = home;
  run.inTime = null;
  document.getElementById("tstart").onclick = e => { stopTimer(); timerEnd = Date.now()+20*60*1000; e.target.disabled=true; tick(); timerId=setInterval(tick,1000); };
  document.getElementById("reveal").onclick = reveal;
}
function tick(){ const left = Math.max(0, timerEnd-Date.now()); const el=document.getElementById("tm"); if(!el) return stopTimer();
  el.textContent = String(Math.floor(left/60000)).padStart(2,"0")+":"+String(Math.floor(left/1000)%60).padStart(2,"0");
  if(left<=0){ stopTimer(); el.style.color="var(--bad)"; } }
function reveal(){
  const s = run.stage;
  run.inTime = timerEnd && Date.now()<=timerEnd && timerId!==null;
  stopTimer();
  document.getElementById("reveal").disabled = true; document.getElementById("tstart").disabled = true;
  document.getElementById("checks").innerHTML = `<h3 style="font-size:19px;margin:18px 0 4px">모범 답안 체크리스트</h3>
    <p class="small" style="margin:0 0 6px">내 설계에도 있는 것만 체크. 항목당 +15 XP. 다르게 설계했다면 어떤 비즈니스 규칙을 다르게 가정했는지 solutions/에 적어두기.</p>
    ${s.pts.map((p,i)=>`<label class="check"><input type="checkbox" id="pt${i}"><span>${esc(p)}</span></label>`).join("")}
    <div class="submitbar"><button class="btn primary" id="clear">스테이지 클리어</button><a class="btn ghost" href="${REPO+s.file}" target="_blank" rel="noopener">✅ 모범 답안 전문</a></div>`;
  document.getElementById("clear").onclick = clearStage;
}
function clearStage(){
  const s = run.stage;
  const got = s.pts.filter((_,i)=>document.getElementById("pt"+i).checked).length;
  const bossXp = got*15 + 30 + (run.inTime?20:0);
  const total = run.xp + bossXp;
  const st = run.hearts; // 3,2,1
  const prevLv = level(S.xp).n;
  S.xp += total;
  const first = !S.best[s.id];
  S.best[s.id] = Math.max(S.best[s.id]||0, st);
  const d = today(); S.log[d] = S.log[d]||{}; S.log[d][s.track] = 1;
  save();
  const lvUp = level(S.xp).n > prevLv;
  const daily = S.log[d].rdb && S.log[d].dw;
  $app.innerHTML = `<section class="panel result">
    <span class="tag ${s.track}">${s.track.toUpperCase()}-0${s.day}</span>
    <h2>CLEAR</h2>
    <div class="bigstars">${[0,1,2].map(i=>starSvg(i<st)).join("")}</div>
    <div class="kv">
      <div><b>+${run.xp}</b><span>퀴즈 XP</span></div>
      <div><b>${run.hintsUsed}</b><span>힌트 사용</span></div>
      <div><b>${got}/${s.pts.length}</b><span>설계 체크</span></div>
      <div><b>+${bossXp}</b><span>보스 XP${run.inTime?" (시간 보너스 포함)":""}</span></div>
    </div>
    ${lvUp?`<p style="font-family:var(--f-display);font-size:22px;color:var(--accent);margin:6px 0">LEVEL UP · ${level(S.xp).name}</p>`:""}
    <p class="small">${daily?"오늘의 퀘스트 완료. 연속 "+streak()+"일째.":"오늘의 퀘스트: "+(s.track==="rdb"?"DW":"RDB")+" 한 판 남음."}${first?"":" (재도전: 최고 별 기록만 남는다)"}</p>
    <div class="center"><button class="btn primary" id="home">맵으로 (Enter)</button><button class="btn" id="again">다시 하기</button></div>
  </section>`;
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches) popText(`+${total} XP`);
  document.getElementById("home").onclick = home; document.getElementById("home").focus();
  document.getElementById("again").onclick = () => brief(s.id);
}
function gameOver(){
  const s = run.stage; S.xp += run.xp; save();
  $app.innerHTML = `<section class="panel result">
    <span class="tag ${s.track}">${s.track.toUpperCase()}-0${s.day}</span>
    <h2 style="color:var(--bad)">PK 위반</h2>
    <div class="bigstars">${keySvg(true)}${keySvg(true)}${keySvg(true)}</div>
    <p>열쇠 3개를 다 썼다. 틀린 문제는 오답노트에 들어갔다. 얻은 XP ${run.xp}은 유지.</p>
    <div class="center"><button class="btn primary" id="again">다시 도전 (Enter)</button><button class="btn" id="home">맵으로</button></div>
  </section>`;
  document.getElementById("again").onclick = () => startStage(s.id); document.getElementById("again").focus();
  document.getElementById("home").onclick = home;
}
function reviewDone(){
  S.xp += run.xp; save();
  const ok = run.res.filter(Boolean).length;
  $app.innerHTML = `<section class="panel result"><h2>복습 끝</h2>
    <div class="kv"><div><b>${ok}/${run.list.length}</b><span>맞힘 (오답노트에서 지움)</span></div><div><b>${run.hintsUsed}</b><span>힌트 사용</span></div><div><b>+${run.xp}</b><span>XP</span></div><div><b>${S.wrong.length}</b><span>남은 오답</span></div></div>
    <div class="center"><button class="btn primary" id="home">맵으로 (Enter)</button>${S.wrong.length?`<button class="btn" id="again">남은 오답 다시</button>`:""}</div></section>`;
  document.getElementById("home").onclick = home; document.getElementById("home").focus();
  const a=document.getElementById("again"); if(a) a.onclick = startReview;
}

/* 키보드: 1~4로 객관식, H로 다음 힌트, Enter로 진행 */
document.addEventListener("keydown", e=>{
  if(!run || e.target.tagName==="INPUT") return;
  if((e.key==="h"||e.key==="H"||e.key==="ㅗ") && !e.metaKey && !e.ctrlKey){ const b=document.getElementById("hbtn"); if(b && !b.disabled){ e.preventDefault(); b.click(); } return; }
  const q = run.list && run.list[run.qi] && run.list[run.qi].q;
  if(q && q.t==="mcq" && /^[1-4]$/.test(e.key)){ const b=$app.querySelector(`.opt[data-k="${+e.key-1}"]`); if(b && !b.disabled) b.click(); }
});

home();
</script>
</html>
